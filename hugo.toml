baseURL = "https://mayuxiang.com"
locale = "zh-CN"
title = "马宇翔@河南大学"

# robots.txt is served from static/robots.txt (single source of truth), so the
# built-in generator stays disabled (default) to avoid a duplicate at /robots.txt.

disableKinds = ["taxonomy", "term", "RSS"]

disableHugoGeneratorInject = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[outputs]
  home = ["HTML"]
