{{ $s := .Site.Data.site }}
<!-- Schema.org Person -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ $s.name }}",
  "alternateName": "{{ $s.nameEn }}",
  "jobTitle": "{{ $s.title }}",
  "affiliation": {
    "@type": "Organization",
    "name": "{{ $s.affiliation }}"
  },
  "email": "{{ $s.email }}",
  "url": "{{ .Site.BaseURL }}",
  "image": "{{ .Site.BaseURL }}images/me.webp",
  "description": "{{ if $s.oneliner }}{{ $s.oneliner }}{{ else }}{{ $s.name }} — {{ $s.affiliation }}{{ end }}",
  "sameAs": [
    {{ range $i, $url := $s.sameAs }}{{ if $i }}, {{ end }}"{{ $url }}"{{ end }}
  ]
}
</script>
{{ with .OutputFormats.Get "RSS" }}
  {{ printf `<link rel="%s" type="%s" href="%s" title="%s">` .Rel .MediaType.Type .RelPermalink $.Site.Title | safeHTML }}
{{ end }}
<link rel="canonical" href="{{ .Permalink }}">
